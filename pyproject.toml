[project]
name = "infra-advisor"
version = "0.1.0"
description = "저장소를 읽어 배포 인프라를 근거와 함께 추천하는 읽기 전용 MCP 서버"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
infra-advisor = "infra_advisor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra_advisor"]
